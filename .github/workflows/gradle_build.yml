name: Java CI with Gradle

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 第 1 步：先装 Java 22（默默下载好，供项目内部按需调用）
    - name: Set up JDK 22 for Toolchain
      uses: actions/setup-java@v4
      with:
        java-version: '22'
        distribution: 'temurin'

    # 第 2 步：后装 Java 21（覆盖系统默认值，保证 Gradle 本身用 21 启动）
    - name: Set up JDK 21 for Gradle
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Configure Gradle Toolchains
      run: |
        mkdir -p ~/.gradle
        echo "org.gradle.java.installations.auto-detect=true" >> ~/.gradle/gradle.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle
      run: ./gradlew build -Pmod_version="1.21.1-custom"

    - name: Archive Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Artifacts
        path: dist/
